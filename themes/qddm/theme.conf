[General]
# qddm video playlist (SDDM-safe: always muted, no audio, no history file).
# mode: random | fixed | sequence
#   random   — shuffled bag, every video once per cycle, then reshuffle
#   fixed    — single video looped forever (see fixedFile)
#   sequence — alphabetical order, wrap around
# playback: repeats per video before advancing (only when repeat=true and mode != fixed)
#   0 = loop current video forever, 1 = once then advance, 2 = twice then advance, …
# repeat: true = seamless in-player looping | false = play once then advance (playback ignored)
# fixedFile: bare file name inside videos/ (mode=fixed only), empty = first video found
# showTitle: true = bottom-center now-playing pill | false = clean screen
videoMode=random
playback=0
repeat=true
fixedFile=
# videoPath: absolute host folder used at runtime INSTEAD of bundled videos/
# (for git-annex libraries like ~/qSets/qDDM whose symlinks cannot be
#  copied into the Nix store). Empty = use bundled videos/ dir.
videoPath=
showTitle=true
